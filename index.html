<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Super FM 98.9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --blue:      #0047CC;
    --blue-mid:  #0057F5;
    --blue-dark: #003399;
    --yellow:    #FFD700;
    --yellow-dark:#E6B800;
    --bg:        #f6f7fb;
    --white:     #ffffff;
    --border:    #dce6ff;
    --text:      #0a1a4a;
    --muted:     #6b7fb5;
    --radius:    18px;
    --radius-sm: 12px;
  }

  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Montserrat', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding-bottom: 50px;
  }

  .card {
    width: 100%;
    max-width: 430px;
    background: var(--bg);
  }

  /* ══ CAPA ══ */
  .hero {
    position: relative;
    width: 100%;
    overflow: hidden;
  }

  .hero::before {
    content:'';
    position:absolute; top:0; left:0;
    width:100%; height:5px; z-index:3;
    background: linear-gradient(90deg, var(--blue-dark), var(--blue), var(--yellow), var(--blue-mid), var(--blue-dark));
    background-size: 300% 100%;
    animation: brandSlide 4s linear infinite;
  }

  @keyframes brandSlide {
    0%   { background-position:0%; }
    100% { background-position:300%; }
  }

  .hero img {
    width:100%; height:auto; display:block;
    animation: fadeIn .8s ease both;
  }

  @keyframes fadeIn {
    from { opacity:0; transform:scale(1.03); }
    to   { opacity:1; transform:scale(1); }
  }

  /* ══ SEÇÕES ══ */
  .section {
    padding: 18px 16px 0;
    animation: slideUp .6s ease both;
  }

  .section + .section { padding-top: 14px; }

  @keyframes slideUp {
    from { opacity:0; transform:translateY(20px); }
    to   { opacity:1; transform:translateY(0); }
  }

  .section:nth-child(2) { animation-delay: .15s; }
  .section:nth-child(3) { animation-delay: .25s; }
  .section:nth-child(4) { animation-delay: .35s; }
  .section:nth-child(5) { animation-delay: .45s; }

  /* label da seção */
  .sec-label {
    font-size: 9.5px; font-weight: 800;
    letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
    padding-left: 2px;
  }

  /* ══ CARD BRANCO (agrupador) ══ */
  .group {
    background: var(--white);
    border-radius: var(--radius);
    border: 1.5px solid var(--border);
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(30,35,100,.05);
  }

  /* ══ ITEM DE CONTATO (linha dentro do group) ══ */
  .contact-item {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px;
    text-decoration: none;
    border-bottom: 1px solid var(--border);
    transition: background .18s;
    -webkit-tap-highlight-color: transparent;
    position: relative; overflow: hidden;
  }

  .contact-item:last-child { border-bottom: none; }
  .contact-item:hover { background: #f8f9ff; }
  .contact-item:active { background: #f0f2fa; }

  .ci-icon {
    width: 42px; height: 42px; flex-shrink:0;
    border-radius: 11px;
    display: flex; align-items:center; justify-content:center;
  }
  .ci-icon svg { width:22px; height:22px; fill:white; }

  .ci-text { flex:1; }
  .ci-label { font-size:10px; font-weight:700; color:var(--muted); letter-spacing:.8px; text-transform:uppercase; }
  .ci-val   { font-size:13px; font-weight:800; color:var(--text); margin-top:2px; }

  .ci-arrow { color: var(--border); flex-shrink:0; }
  .ci-arrow svg { width:16px; height:16px; fill:var(--muted); }

  /* ícones coloridos */
  .ic-wpp    { background: linear-gradient(135deg,#25d366,#128c7e); }
  .ic-phone  { background: linear-gradient(135deg, var(--blue-mid), var(--blue-dark)); }
  .ic-insta  { background: linear-gradient(135deg,#f09433,#dc2743 55%,#bc1888); }
  .ic-site   { background: linear-gradient(135deg, var(--blue), var(--blue-dark)); }

  /* ══ APP BADGES ══ */
  .app-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .app-badge {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    text-decoration: none;
    color: white;
    transition: transform .2s ease, filter .2s;
    -webkit-tap-highlight-color: transparent;
    position: relative; overflow: hidden;
  }

  .app-badge:hover  { transform:translateY(-2px); filter:brightness(1.1); }
  .app-badge:active { transform:scale(.97); }

  .ab-apple  { background: #1c1c1e; }
  .ab-google { background: #01875f; }

  /* label da seção com cor da marca */
  .sec-label { color: var(--blue); }

  .app-badge svg { width:24px; height:24px; fill:white; flex-shrink:0; }

  .ab-text { display:flex; flex-direction:column; }
  .ab-sub  { font-size:9px; font-weight:600; opacity:.75; letter-spacing:.5px; text-transform:uppercase; }
  .ab-name { font-size:13px; font-weight:800; margin-top:1px; line-height:1.1; }

  /* ══ PLAYER AO VIVO ══ */
  .live-bar {
    display: flex; align-items:center; gap:12px;
    padding: 14px 16px;
    background: linear-gradient(135deg, var(--blue-dark), var(--blue-mid));
    border-radius: var(--radius);
    margin: 18px 16px 0;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    animation: slideUp .5s .1s ease both;
    transition: filter .2s;
    position: relative; overflow: hidden;
  }
  .live-bar:hover  { filter: brightness(1.08); }
  .live-bar:active { filter: brightness(.95); }

  /* botão play/pause */
  .play-btn {
    width: 38px; height: 38px; flex-shrink:0;
    border-radius: 50%;
    background: rgba(255,255,255,.2);
    display: flex; align-items:center; justify-content:center;
    transition: background .2s, transform .2s;
    border: 1.5px solid rgba(255,255,255,.4);
  }
  .live-bar:hover .play-btn { background: rgba(255,255,255,.3); }
  .play-btn svg { width:18px; height:18px; fill:white; }

  /* ícone pause (oculto por padrão) */
  .icon-pause { display:none; }
  .live-bar.playing .icon-play  { display:none; }
  .live-bar.playing .icon-pause { display:block; }

  /* ponto piscante */
  .live-dot {
    width:9px; height:9px; border-radius:50%;
    background:white; flex-shrink:0;
    opacity: 0; /* visível só quando tocando */
    transition: opacity .3s;
    animation: livePulse 1.2s ease-in-out infinite;
  }
  .live-bar.playing .live-dot { opacity: 1; }

  @keyframes livePulse {
    0%,100% { opacity:1; transform:scale(1); }
    50%      { opacity:.35; transform:scale(.65); }
  }

  .live-text { flex:1; }
  .live-title { font-size:12px; font-weight:900; color:white; letter-spacing:.5px; text-transform:uppercase; }
  .live-sub   { font-size:10px; color:rgba(255,255,255,.8); font-weight:600; margin-top:2px; }

  /* carregando */
  .live-loading {
    font-size:9px; font-weight:700; color:rgba(255,255,255,.7);
    letter-spacing:1px; text-transform:uppercase;
    display:none;
  }
  .live-bar.loading .live-loading { display:block; }
  .live-bar.loading .live-sub     { display:none; }

  /* ondas — animam só quando playing */
  .wave-bars {
    display:flex; align-items:center; gap:3px; height:22px;
  }
  .wave-bars span {
    display:block; width:3px; border-radius:99px;
    background:rgba(255,255,255,.8);
    animation: waveAnim 1.1s ease-in-out infinite;
    animation-play-state: paused;
    transform: scaleY(.3);
    transition: transform .3s;
  }
  .live-bar.playing .wave-bars span { animation-play-state: running; transform: scaleY(1); }

  .wave-bars span:nth-child(1){height:6px; animation-delay:0s;}
  .wave-bars span:nth-child(2){height:16px;animation-delay:.1s;}
  .wave-bars span:nth-child(3){height:22px;animation-delay:.2s;}
  .wave-bars span:nth-child(4){height:14px;animation-delay:.3s;}
  .wave-bars span:nth-child(5){height:8px; animation-delay:.15s;}

  @keyframes waveAnim {
    0%,100%{transform:scaleY(1);}
    50%    {transform:scaleY(.35);}
  }

  /* ══ FOOTER ══ */
  .footer {
    margin: 18px 16px 0;
    background: linear-gradient(135deg, var(--blue-dark), var(--blue-mid));
    border-radius: var(--radius);
    padding: 14px 20px;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .footer .dot { width:4px; height:4px; border-radius:50%; background:var(--yellow); }
  .footer span { color:rgba(255,255,255,.5); font-size:9.5px; font-weight:700; letter-spacing:1.8px; text-transform:uppercase; }

  /* ══ RIPPLE ══ */
  .ripple {
    position:absolute; border-radius:50%; pointer-events:none;
    transform:scale(0); animation:rip .55s linear;
    background:rgba(255,255,255,.2);
  }
  @keyframes rip { to { transform:scale(4); opacity:0; } }

  @media (min-width:431px) {
    body { padding:24px 16px 60px; }
    .card { border-radius:var(--radius); overflow:hidden; box-shadow:0 20px 60px rgba(30,35,100,.14); }
    .hero { border-radius:var(--radius) var(--radius) 0 0; }
  }
</style>
</head>

<script>
  const STREAM  = 'https://cast3.hoost.com.br:8217/live';
  const player  = document.getElementById('player');
  const liveBar = document.getElementById('liveBar');
  const liveSub = document.querySelector('.live-sub');

  function togglePlay() {
    if (player.paused) {
      // define src somente no clique (gesto do usuário — evita bloqueio do browser)
      player.src = STREAM;
      liveBar.classList.add('loading');
      liveBar.classList.remove('playing');
      liveSub.textContent = 'Conectando...';
      player.play().catch(() => {
        setStop();
      });
    } else {
      setStop();
    }
  }

  function setStop() {
    player.pause();
    player.removeAttribute('src');
    player.load(); // libera o buffer
    liveBar.classList.remove('playing', 'loading');
    liveSub.textContent = 'Toque para ouvir';
  }

  player.addEventListener('playing', () => {
    liveBar.classList.remove('loading');
    liveBar.classList.add('playing');
    liveSub.textContent = 'Ao vivo agora ●';
  });

  player.addEventListener('waiting', () => {
    liveBar.classList.add('loading');
    liveBar.classList.remove('playing');
  });

  player.addEventListener('error', () => setStop());

  /* ripple */
  document.querySelectorAll('.contact-item, .app-badge').forEach(el => {
    el.addEventListener('click', function(e) {
      const r = this.getBoundingClientRect();
      const size = Math.max(r.width, r.height) * 2;
      const rip = document.createElement('span');
      rip.className = 'ripple';
      rip.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-r.left-size/2}px;top:${e.clientY-r.top-size/2}px`;
      this.appendChild(rip);
      setTimeout(() => rip.remove(), 600);
    });
  });
</script>
